    paths: [.github/workflows/public-contact-expansion-2000.yml]
permissions:
  actions: read
jobs:
  youtube-additional-public-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-lifestyle-creator-directories
          run-id: 35678516924
          github-token: ${{ github.token }}
          path: input-pool
      - uses: actions/download-artifact@v4
        with:
          name: public-youtube-details
          run-id: 35679437296
          github-token: ${{ github.token }}
          path: input-old
      - uses: actions/download-artifact@v4
        with:
          name: public-additional-contact-research-0922
          run-id: 35703194842
          github-token: ${{ github.token }}
          path: input-extra
      - run: python -m pip install --quiet beautifulsoup4
      - name: Extend public category listings and read new public introductions
        run: |
          mkdir -p research-output
          python -u - <<'PY'
          import urllib.request,urllib.error,urllib.robotparser,urllib.parse,json,pathlib,time,re,threading,concurrent.futures,hashlib,datetime,unicodedata
          from bs4 import BeautifulSoup
          root=pathlib.Path('research-output');host='https://allsnsrank.com';agent='PublicCreatorResearch/1.0 (public business profiles; no outreach)'
          rp=urllib.robotparser.RobotFileParser()
          with urllib.request.urlopen(urllib.request.Request(host+'/robots.txt',headers={'User-Agent':agent}),timeout=20) as r:rt=r.read().decode();rp.parse(rt.splitlines());(root/'robots.txt').write_text(rt)
          interval=max(.65,rp.crawl_delay(agent) or 0,rp.crawl_delay('*') or 0);lock=threading.Lock();last=[0];stop=threading.Event();manifest=[]
          def get(url):
              if stop.is_set():raise RuntimeError('host_stopped')

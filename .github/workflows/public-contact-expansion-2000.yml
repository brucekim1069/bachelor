              s={'vlog':24,'beauty':22,'life':12}.get(x['category'],0)+4*(1000<=x['subscribers']<=50000)
              s+=10*bool(re.search('살림|생활|자취|집순이|신혼|리뷰|꿀템|스킨케어|화장품|올리브영|홈트|루틴',t));s+=5*bool(re.search('직장인|퇴근|출근|신혼|부부|집순이',t));return s
          def extend(task):
              slug,scope,maxpage=task;rows=[];seen=set()
              for page in range(150,maxpage):
                  url=host+'/sns/rank_api.php?'+urllib.parse.urlencode({'sort':'subscribers','region':'KR','scope':'category:'+str(scope),'offset':30*page})
                  try:
                      text=get(url);d=json.loads(text);s=BeautifulSoup(d.get('html',''),'html.parser');rr=s.select('.pbrow');subs=[]
                      if not rr:break
                      for r in rr:
                          a=r.select_one('a.pb-name');m=r.select_one('.pb-metric .s')
                          if not a or not m:continue
                          cid=a.get('href','').rsplit('/',1)[-1];sub=int(re.sub(r'\D','',m.get_text()) or 0);subs.append(sub)
                          if cid in seen or cid in pmap or not re.fullmatch(r'UC[A-Za-z0-9_-]{22}',cid):continue
                          seen.add(cid)
                          if not 500<=sub<=100000:continue
                          rows.append({'name':a.get_text(' ',strip=True),'channel_id':cid,'subscribers':sub,'category':slug,'tags':[a.get_text(' ',strip=True) for a in r.select('.pb-tags a')],'videos':[{'title':a.get('data-title') or a.get('title'),'url':'https://www.youtube.com/watch?v='+a.get('data-vid','')} for a in r.select('.pb-v')[:2]],'source_url':host+'/youtube/channel/'+cid,'directory_url':url,'profile_url':'https://www.youtube.com/channel/'+cid,'checked':'2026-09-22'})
                      manifest.append({'url':url,'sha256':hashlib.sha256(text.encode()).hexdigest(),'kind':'public_category_list'})
                      if page%30==0:print('LISTING',slug,page,'NEW',len(rows),flush=True)
                      if not d.get('hasMore',False) or (subs and max(subs)<500):break
                  except Exception as e:print('LIST_ERROR',slug,page,str(e),flush=True);break
              return rows
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              for rows in ex.map(extend,[('vlog',5,360),('beauty',4,300),('life',10,500)]):
                  for x in rows:pmap.setdefault(x['channel_id'],x)
          (root/'expanded_youtube_pool.json').write_text(json.dumps(list(pmap.values()),ensure_ascii=False));(root/'listing_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False));candidates=sorted([x for x in pmap.values() if x['channel_id'] not in known and score(x)>=0],key=lambda x:(-score(x),x['subscribers']))[:4200];print('POOL',len(pmap),'NEW_CANDIDATES',len(candidates),flush=True)
          def one(x):
              z=dict(x);z['detail_ok']=False;z['selection_score']=score(x)
              try:
                  html=get(x['source_url']);z['fetched_at']=datetime.datetime.now(datetime.timezone.utc).isoformat();z['source_sha256']=hashlib.sha256(html.encode()).hexdigest();s=BeautifulSoup(html,'html.parser');h=s.select_one('h1');desc=s.select_one('.desc')
                  if not h:raise RuntimeError('no_public_profile')
                  z['current_page_name']=h.get_text(' ',strip=True)
                  if desc:
                      for a in desc.select('[data-cfemail]'):
                          try:b=bytes.fromhex(a['data-cfemail']);a.replace_with(''.join(chr(v^b[0]) for v in b[1:]))
                          except Exception:pass
                      intro=desc.get_text('\n',strip=True);z['intro']=intro[:6000];z['emails']=sorted(set(emailre.findall(intro))) if contact.search(unicodedata.normalize('NFKC',intro)) else []
                      urls=re.findall(r'https?://[^\s<>\"\x27]+',intro);urls.extend(a.get('href','') for a in desc.find_all('a',href=True));z['social_urls']=list(dict.fromkeys(u.rstrip('.,;)') for u in urls if re.search('instagram.com|blog.naver.com|youtube.com|linktr.ee|litt.ly',u)))
                  z['profile_type']=s.select_one('.htags').get_text(' ',strip=True) if s.select_one('.htags') else '';recent=[]
                  for a in s.select('#sec-recent a.vid')[:8]:
                      m=re.search(r'\d{4}-\d{2}-\d{2}',a.get('data-meta',''));recent.append({'title':a.get('data-title','')[:240],'date':m.group() if m else '','url':'https://www.youtube.com/watch?v='+a.get('data-vid','')})
                  z['recent_videos']=recent;z['latest_public_date']=max([v['date'] for v in recent] or ['']);z['detail_ok']=True
                  intro=unicodedata.normalize('NFKC',z.get('intro',''));t=x['name']+' '+intro+' '+' '.join(v['title'] for v in recent[:6]);es=z.get('emails',[])
                  reasons=[]
                  if not es:reasons.append('no_public_business_email')
                  if not ('2026-03-26'<=z['latest_public_date']<='2026-09-22'):reasons.append('recent_activity_not_confirmed')
                  if minor.search(t):reasons.append('minor_or_child_content_indicator')
                  if agency.search(t):reasons.append('agency_indicator')
                  if unrelated.search(x['name']+' '+intro):reasons.append('business_or_unrelated_indicator')
                  if nocol.search(intro):reasons.append('collaboration_declined')
                  if not positive.search(t):reasons.append('topic_not_confirmed')
                  if any(e.startswith(('-','.')) or '..' in e or re.search(r'@(?:gmai\.com|gmali\.com|gmail\.con|example\.)',e,re.I) for e in es):reasons.append('email_format_review')
                  z['review_reasons']=reasons;z['preliminary_eligible']=not reasons
              except Exception as e:z['error']=str(e)
              return z
          out=[];good=[];used=set()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              for start in range(0,len(candidates),150):
                  batch=list(ex.map(one,candidates[start:start+150]));out.extend(batch)
                  for x in batch:
                      es={e.lower() for e in x.get('emails',[])}
                      if x.get('preliminary_eligible') and not es&used:good.append(x);used.update(es)
                  (root/'new_youtube_details.json').write_text(json.dumps(out,ensure_ascii=False));(root/'new_youtube_business_contacts.json').write_text(json.dumps(good,ensure_ascii=False));print('READ',len(out),'PUBLIC_EMAILS',sum(bool(x.get('emails')) for x in out),'PRELIMINARY',len(good),flush=True)
                  if stop.is_set() or len(good)>=1200:break
          summary={'new_profiles_read':len(out),'preliminary_business_contacts':len(good),'public_email_profiles':sum(bool(x.get('emails')) for x in out),'pool_size':len(pmap),'host_stopped':stop.is_set(),'rate_interval_seconds':interval,'email_sent':0,'dm_sent':0,'checked_date':'2026-09-22','status':'Public source research only; mailbox, consent, product fit and identity require separate checks.'};(root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-contact-expansion-2000-youtube
          path: research-output/
          retention-days: 1
          compression-level: 9
  blog-additional-public-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-inlink-enriched-profiles
          run-id: 35679701735
          github-token: ${{ github.token }}
          path: input1
      - uses: actions/download-artifact@v4
        with:
          name: public-inlink-supplemental-enriched
          run-id: 35680361599
          github-token: ${{ github.token }}
          path: input2
      - uses: actions/download-artifact@v4
        with:
          name: public-lifestyle-additional-profiles-0922
          run-id: 35690394452
          github-token: ${{ github.token }}
          path: input3
      - uses: actions/download-artifact@v4
        with:
          name: public-blog-contact-research-0922
          run-id: 35704563569
          github-token: ${{ github.token }}
          path: old
      - run: python -m pip install --quiet beautifulsoup4
      - name: Read additional public blog introductions; no login or submissions
        run: |
          mkdir -p blog-output
          python -u - <<'PY'
          import urllib.request,urllib.error,urllib.robotparser,urllib.parse,json,pathlib,time,re,threading,concurrent.futures,hashlib,datetime
          from bs4 import BeautifulSoup
          root=pathlib.Path('blog-output');host='https://www.ndex.kr';agent='PublicCreatorResearch/1.0 (public business profiles; no outreach)';rp=urllib.robotparser.RobotFileParser()
          try:
              with urllib.request.urlopen(urllib.request.Request(host+'/robots.txt',headers={'User-Agent':agent}),timeout=20) as r:rt=r.read().decode();rp.parse(rt.splitlines());(root/'robots.txt').write_text(rt)
          except urllib.error.HTTPError as e:

              else:raise
          old=json.loads(pathlib.Path('old/public_blog_details.json').read_text());known={x['blog_id'].lower() for x in old};rows={};weights={'supplies':30,'lifestyle':28,'beauty':26,'fashion':20,'travel':19,'fitness':18,'food':7};bad=re.compile(r'육아|키즈|어린이|미성년|아동|유아|baby|kids|초등학생|중학생|고등학생|주식회사|공인중개|부동산|의원|병원|정치|게임|투자|(?:0[8-9]|1[0-9])년생',re.I)
          for folder,name in [('input1','inlink_enriched.json'),('input2','supplemental_enriched.json'),('input3','additional_enriched.json')]:
              data=json.loads((pathlib.Path(folder)/name).read_text())
              for x in data:
                  cats=x.get('category_slugs',[]);text=x.get('name','')+' '+x.get('intro','')
                  if 'parenting' in cats or bad.search(text) or not set(cats)&set(weights):continue
                  for a in x.get('social_urls',[]):
                      if not isinstance(a,dict) or a.get('platform')!='naver_blog':continue
                      u=urllib.parse.urlsplit(a['url']);p=[s for s in u.path.split('/') if s]
                      if len(p)!=1 or not re.fullmatch(r'[A-Za-z0-9_-]{2,50}',p[0]):continue
                      bid=p[0]
                      if bid.lower() in known:continue
                      rows.setdefault(bid.lower(),{'blog_id':bid,'name':x['name'],'profile_url':'https://blog.naver.com/'+bid,'prior_source_url':x['source_url'],'category_slugs':cats,'adult_declared':x.get('adult_declared',False),'other_channels':x.get('social_urls',[]),'portfolio_links':x.get('portfolio_links',[])[:4],'score':max(weights.get(c,0) for c in cats)+5*bool(x.get('adult_declared'))})
          candidates=sorted(rows.values(),key=lambda x:(-x['score'],x['blog_id']))[:1700];lock=threading.Lock();last=[0];stop=threading.Event();interval=max(.8,rp.crawl_delay(agent) or 0,rp.crawl_delay('*') or 0);contact=re.compile(r'문의|협찬|협업|광고|제안|메일|mail|contact|business|✉|💌|📧|📩|📨|📮',re.I);emailre=re.compile(r'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}')
          def one(x):
              z=dict(x);url=host+'/data/'+urllib.parse.quote(x['blog_id']);z['source_url']=url;z['detail_ok']=False
              try:
                  if stop.is_set():raise RuntimeError('host_stopped')
                  if not rp.can_fetch(agent,url) or not rp.can_fetch('ChatGPT-User',url):raise RuntimeError('robots_disallow')
                  with lock:time.sleep(max(0,interval-(time.monotonic()-last[0])));last[0]=time.monotonic()
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=20) as r:html=r.read(2200000).decode('utf-8','replace')
                  s=BeautifulSoup(html,'html.parser');title=s.title.get_text(' ',strip=True) if s.title else ''
                  for e in s.select('script,style,nav,footer'):e.decompose()
                  text=s.get_text('\n',strip=True);i=text.find('블로그 소개')
                  if i<0:raise RuntimeError('no_public_intro')
                  intro=text[i+len('블로그 소개'):].split('참여도 지표 분석')[0].strip();z['intro']=intro[:2200];z['emails']=sorted(set(emailre.findall(intro))) if contact.search(intro) else [];z['page_title']=title
                  m=re.search(r'일\s*평균\s*방문자\s*[:：]?\s*([\d,]+)',text);z['daily_visitors']=int(m[1].replace(',','')) if m else None
                  dates=[d for d in re.findall(r'\b20\d{2}-\d{2}-\d{2}\b',text) if '2024-01-01'<=d<='2026-09-22'];z['latest_listed_date']=max(dates) if dates else '';j=text.find('누락 포스팅 및 지수 조회');z['post_excerpt']=text[j:min(i,j+2400)] if 0<=j<i else '';z['detail_ok']=True;z['fetched_at']=datetime.datetime.now(datetime.timezone.utc).isoformat();z['source_sha256']=hashlib.sha256(html.encode()).hexdigest()
              except urllib.error.HTTPError as e:
                  z['error']='HTTP_'+str(e.code)
                  if e.code in (401,403,429):stop.set()
              except Exception as e:z['error']=str(e)
              return z
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:

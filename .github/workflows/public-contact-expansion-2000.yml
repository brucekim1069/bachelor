                  out.extend(ex.map(one,candidates[start:start+100]));(root/'new_blog_details.json').write_text(json.dumps(out,ensure_ascii=False));print('READ',len(out),'PUBLIC_INTROS',sum(x['detail_ok'] for x in out),'EMAIL_PROFILES',sum(bool(x.get('emails')) for x in out),flush=True)
                  if stop.is_set():break
          summary={'new_profiles_read':len(out),'public_intros':sum(x['detail_ok'] for x in out),'email_profiles':sum(bool(x.get('emails')) for x in out),'email_sent':0,'dm_sent':0,'host_stopped':stop.is_set(),'checked_date':'2026-09-22','status':'Public biography listing only; timestamps are third-party page labels, not confirmed current posting dates.'};(root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:

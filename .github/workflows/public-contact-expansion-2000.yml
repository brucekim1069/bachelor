              with lock:time.sleep(max(0,interval-(time.monotonic()-last[0])));last[0]=time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=25) as r:html=r.read(2200000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  if e.code in (401,403,429):stop.set()
                  raise
              return html
          minor=re.compile(r'초등학생|중학생|고등학생|초딩|중딩|고딩|키즈|어린이|유치원|교복|수능|중학교|고등학교|중[123]|고[123]|육아|아기|아동|장난감|뽀로로|\b(?:kids?|baby|children|teenager)\b|(?:0[8-9]|1[0-9])년생|1[0-7]살|1[0-7]세|잼민',re.I)
          unrelated=re.compile(r'뉴스|주식|코인|정치|게임|마인크래프트|로블록스|원신|리니지|포켓몬|프라모델|낚시|농사|농장|도박|경마|경륜|묵상|찬양|설교|성인영상|Entertainment|주식회사|공식\s*채널|성형외과|피부과의원|의원|치과|클리닉|병원|미용실|헤어샵|중고차|공인중개|부동산|교회|목사|사주|타로|보험|분양|대출|학원|쇼핑몰|렌탈|입시|작명|제품\s*문의|수강\s*문의|시공\s*문의|외벽|코킹|철거|설비|구매\s*문의|법률사무소|공식\s*유튜브',re.I)
          agency=re.compile(r'샌드박스|sandbox|레페리|leferi|트레져헌터|treasurehunter|다이아\s*티비|dia\s*tv|cj\.net|shortt\.kr|숏뜨|ag-ent|카론|charon|순이엔티|soonet|mcn@|doohocorp|ypco\.kr|collabasia|icecreative|wishcompany|gysent',re.I)
          positive=re.compile(r'생활|살림|자취|집순이|일상|브이로그|vlog|집밥|신혼|부부|여행|인테리어|메이크업|뷰티|화장품|스킨케어|올리브영|파우치|리뷰|꿀템|추천템|패션|코디|하울|청소|정리|루틴|퇴근|직장인|홈트|필라테스|요가|캠핑',re.I)
          contact=re.compile(r'문의|비즈니스|비지니스|협업|광고|contact|business|협찬|e-?mail|메일|📩|📨|📧|💌|✉|📮',re.I)

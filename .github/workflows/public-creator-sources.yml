name: Public creator contact research
on:
  push:
    branches: [research/public-creator-sources-20260922]
    paths: [.github/workflows/public-creator-sources.yml]
permissions:
  actions: read
jobs:
  public-contact-research:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-lifestyle-creator-directories
          run-id: 35678516924
          github-token: ${{ github.token }}
          path: input-pool
      - uses: actions/download-artifact@v4
        with:
          name: public-youtube-details
          run-id: 35679437296
          github-token: ${{ github.token }}
          path: input-old
      - run: python -m pip install --quiet beautifulsoup4
      - name: Read additional public creator profiles; do not send any messages
        run: |
          mkdir -p research-output
          python -u - <<'PY'
          import urllib.request,urllib.error,urllib.robotparser,urllib.parse,json,pathlib,time,re,threading,concurrent.futures,hashlib,datetime
          from bs4 import BeautifulSoup
          root=pathlib.Path('research-output');host='https://allsnsrank.com';agent='PublicCreatorResearch/1.0 (public business profiles; no outreach)'
          rp=urllib.robotparser.RobotFileParser()
          with urllib.request.urlopen(urllib.request.Request(host+'/robots.txt',headers={'User-Agent':agent}),timeout=20) as r:rt=r.read().decode();rp.parse(rt.splitlines());(root/'robots.txt').write_text(rt)
          interval=max(.6,rp.crawl_delay(agent) or 0,rp.crawl_delay('*') or 0)
          lock=threading.Lock();last=[0];stop=threading.Event()
          minor=re.compile(r'초등학생|중학생|고등학생|초딩|중딩|고딩|키즈|어린이|유치원|교복|수능|중학교|고등학교|중1|중2|중3|고1|고2|고3|육아|아기|아동|장난감|뽀로로',re.I)
          unrelated=re.compile(r'뉴스|주식|코인|정치|게임|마인크래프트|로블록스|원신|리니지|포켓몬|프라모델|낚시|농사|농장|도박|경마|경륜|묵상|찬양|설교|성인영상|Entertainment|주식회사|공식\s*채널|성형외과|피부과의원|의원|치과|클리닉|병원|미용실|헤어샵|중고차|공인중개|부동산|교회|목사|사주|타로|보험|분양|대출|학원|쇼핑몰|렌탈|입시|작명|제품\s*문의|수강\s*문의|시공\s*문의|외벽|코킹|철거|설비',re.I)
          agency=re.compile(r'샌드박스|sandbox|레페리|leferi|트레져헌터|treasurehunter|다이아\s*티비|dia\s*tv|cj\.net|shortt\.kr|숏뜨|ag-ent|카론|charon|순이엔티|soonet',re.I)
          positive=re.compile(r'생활|살림|자취|집순이|일상|브이로그|vlog|집밥|신혼|부부|여행|인테리어|메이크업|뷰티|화장품|스킨케어|올리브영|파우치|리뷰|꿀템|추천템|패션|코디|하울|청소|정리|루틴|퇴근|직장인|홈트|필라테스|요가|캠핑',re.I)
          contact=re.compile(r'문의|비즈니스|비지니스|협업|광고|contact|business|협찬|e-?mail|메일|📩|📨|📧|💌',re.I)
          nocol=re.compile(r'광고\s*[Xx×❌]|협찬\s*[Xx×❌]|공구\s*[Xx×❌]|공구\s*진행.*안|협업.*않|광고.*않|협찬.*않|협업.*받지',re.I)
          emailre=re.compile(r'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}')
          pool=json.loads(pathlib.Path('input-pool/youtube_profiles.json').read_text());old=json.loads(pathlib.Path('input-old/youtube_enriched.json').read_text());known={x['channel_id'] for x in old};used={e.lower() for x in old for e in emailre.findall(x.get('intro',''))}
          def score(x):
              name=x['name'];tags=' '.join(x.get('tags',[]));titles=' '.join(v.get('title') or '' for v in x.get('videos',[]));t=name+' '+tags+' '+titles
              if minor.search(t) or unrelated.search(name+' '+tags) or agency.search(t):return -1
              if len(re.findall('[가-힣]',t))<8 or not positive.search(t):return -1
              s={'vlog':24,'beauty':22,'life':12}.get(x['category'],0)+4*(1000<=x['subscribers']<=50000)
              s+=10*bool(re.search('살림|생활|자취|집순이|신혼|리뷰|꿀템|스킨케어|화장품|올리브영|홈트|루틴',t))
              s+=5*bool(re.search('직장인|퇴근|출근|신혼|부부|집순이',t));s-=20*bool(re.search('임신|출산|임산부|수술|질환|암투병|육아',titles))
              return s
          candidates=sorted([x for x in pool if x['channel_id'] not in known and score(x)>=20],key=lambda x:(-score(x),x['subscribers']))[:2900]
          def one(x):
              z=dict(x);url=x['source_url'];z['detail_ok']=False;z['selection_score']=score(x)
              try:
                  if stop.is_set():raise RuntimeError('host_stopped')
                  if not rp.can_fetch(agent,url) or not rp.can_fetch('ChatGPT-User',url):raise RuntimeError('robots_disallow')
                  with lock:time.sleep(max(0,interval-(time.monotonic()-last[0])));last[0]=time.monotonic()
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=25) as r:html=r.read(1800000).decode('utf-8','replace')
                  z['fetched_at']=datetime.datetime.now(datetime.timezone.utc).isoformat();z['source_sha256']=hashlib.sha256(html.encode()).hexdigest()
                  s=BeautifulSoup(html,'html.parser');desc=s.select_one('.desc')
                  if not s.select_one('h1'):raise RuntimeError('no_profile')
                  z['current_page_name']=s.select_one('h1').get_text(' ',strip=True)
                  if desc:
                      for a in desc.select('[data-cfemail]'):
                          try:
                              b=bytes.fromhex(a['data-cfemail']);a.replace_with(''.join(chr(v^b[0]) for v in b[1:]))
                          except Exception:pass
                      intro=desc.get_text('\n',strip=True);z['intro']=intro[:5000];z['emails']=sorted(set(emailre.findall(intro))) if contact.search(intro) else []
                      urls=re.findall(r'https?://[^\s<>\"\x27]+',intro);urls.extend(a.get('href','') for a in desc.find_all('a',href=True));z['social_urls']=list(dict.fromkeys(u.rstrip('.,;)') for u in urls if re.search('instagram.com|blog.naver.com|youtube.com|linktr.ee|litt.ly',u)))
                  z['profile_type']=s.select_one('.htags').get_text(' ',strip=True) if s.select_one('.htags') else ''
                  recent=[]
                  for a in s.select('#sec-recent a.vid')[:8]:
                      m=re.search(r'\d{4}-\d{2}-\d{2}',a.get('data-meta',''));recent.append({'title':a.get('data-title','')[:240],'date':m.group() if m else '','url':'https://www.youtube.com/watch?v='+a.get('data-vid','')})
                  z['recent_videos']=recent;z['latest_public_date']=max([v['date'] for v in recent] or ['']);z['detail_ok']=True
                  intro=z.get('intro','');t=x['name']+' '+intro+' '+' '.join(v['title'] for v in recent[:6]);es=z.get('emails',[])
                  z['preliminary_eligible']=bool(es and '2026-03-26'<=z['latest_public_date']<='2026-09-22' and not minor.search(t) and not agency.search(t) and not unrelated.search(x['name']+' '+intro) and not nocol.search(intro) and positive.search(t) and not any(e.startswith(('-','.')) or '..' in e or re.search(r'@(?:gmai\.com|gmali\.com|gmail\.con|example\.)',e,re.I) for e in es))
              except urllib.error.HTTPError as e:
                  z['error']='HTTP_'+str(e.code)
                  if e.code in (403,429):stop.set()
              except Exception as e:z['error']=str(e)
              return z
          out=[];good=[];done=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              for start in range(0,len(candidates),100):
                  batch=list(ex.map(one,candidates[start:start+100]));out.extend(batch)
                  for x in batch:
                      es={e.lower() for e in x.get('emails',[])}
                      if x.get('preliminary_eligible') and not es&used:good.append(x);used.update(es)
                  (root/'additional_youtube_details.json').write_text(json.dumps(out,ensure_ascii=False));(root/'preliminary_new_contacts.json').write_text(json.dumps(good,ensure_ascii=False));print('READ',len(out),'ELIGIBLE_NEW_CONTACTS',len(good),'STOPPED',stop.is_set(),flush=True)
                  if stop.is_set() or len(good)>=440:break
          summary={'read_profiles':len(out),'preliminary_eligible_new_contacts':len(good),'stopped_for_host_error':stop.is_set(),'email_sent':0,'dm_sent':0,'rate_interval_seconds':interval,'queried_date':'2026-09-22','contact_validation':'Public profile text only; no SMTP delivery test or outreach.'}
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-additional-contact-research-0922
          path: research-output/
          retention-days: 1
          compression-level: 9

name: Public creator source research
on:
  push:
    branches: [research/public-creator-sources-20260922]
    paths: [.github/workflows/public-creator-sources.yml]
permissions: {}
jobs:
  public-visible-creator-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - run: python -m pip install --quiet playwright beautifulsoup4
      - run: python -m playwright install --with-deps chromium
      - name: Collect only the visible first thirty public search cards
        run: |
          mkdir -p research-output
          python -u - <<'PY'
          import asyncio,json,pathlib,re,urllib.request,urllib.robotparser,urllib.parse,time
          from playwright.async_api import async_playwright
          root=pathlib.Path('research-output');agent='PublicCreatorResearch/1.0 (public professional directory; no outreach)'
          rp=urllib.robotparser.RobotFileParser()
          with urllib.request.urlopen('https://inlink.to/robots.txt',timeout=20) as r:rp.parse(r.read().decode().splitlines())
          cats=['lifestyle','supplies','beauty','travel','fashion','fitness','food']
          cities=['Seoul','Gyeonggi','Incheon','Busan','Daegu','Daejeon','Gwangju','Ulsan','Sejong','Gangwon','ChungcheongBukdo','ChungcheongNamdo','JeollaBukdo','JeollaNamdo','GyeongsangBukdo','GyeongsangNamdo','Jeju']
          queries=[{'category':c,'platform':p,'city':city} for city in cities for c in cats for p in ['instagram','naver_blog']]
          queries += [{'category':c,'platform':p,'city':city,'age':age} for city in ['Seoul','Gyeonggi','Incheon','Busan','Daegu'] for c in ['lifestyle','supplies','beauty','travel'] for p in ['instagram','naver_blog'] for age in ['20s','30s','40s']]
          rows={};errors=[];done=0
          platform_labels={'네이버 블로그':'naver_blog','인스타그램':'instagram','유튜브':'youtube'}
          def numeric(t):
              m=re.match(r'([\d,.]+)\s*([KMB만천]?)',t,re.I)
              if not m:return None
              return round(float(m[1].replace(',',''))*{'k':1000,'m':1000000,'b':1000000000,'만':10000,'천':1000}.get(m[2].lower(),1))
          async def main():
              nonlocal_placeholder=None
              global done
              queue=asyncio.Queue()
              for q in queries:queue.put_nowait(q)
              navlock=asyncio.Lock();last=[0]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  context=await browser.new_context(viewport={'width':1400,'height':1000})
                  async def route(r):
                      if r.request.resource_type in ['image','media','font']:await r.abort()
                      else:await r.continue_()
                  await context.route('**/*',route)
                  async def worker():
                      global done
                      page=await context.new_page()
                      while not queue.empty():
                          q=queue.get_nowait();url='https://inlink.to/discover?'+urllib.parse.urlencode(q)
                          try:
                              if not rp.can_fetch(agent,url) or not rp.can_fetch('ChatGPT-User',url):raise RuntimeError('robots_disallow')
                              async with navlock:
                                  await asyncio.sleep(max(0,1.2-(time.monotonic()-last[0])));last[0]=time.monotonic()
                              resp=await page.goto(url,wait_until='domcontentloaded',timeout=40000)
                              if resp and resp.status in [403,429]:raise RuntimeError('http_stop_'+str(resp.status))
                              try:await page.locator('a[href^="/p/"]').first.wait_for(timeout=10000)
                              except Exception:pass
                              await page.wait_for_timeout(650)
                              cards=await page.locator('[data-slot="card"]').evaluate_all("els=>els.filter(e=>e.querySelector('a[href^=\"/p/\"]')).slice(0,30).map(e=>({text:e.innerText,anchors:[...e.querySelectorAll('a[href^=\"/p/\"]')].map(a=>({href:a.getAttribute('href'),name:a.innerText})),portfolio_count:e.querySelectorAll('[aria-label=\"포트폴리오 자세히 보기\"]').length}))")
                              for card in cards:
                                  text=re.sub(r'\s+',' ',card['text']).strip()
                                  if re.search(r'10대|초등학생|중학생|고등학생|키즈|어린이',text):continue
                                  aa=[a for a in card['anchors'] if a['name'].strip()]
                                  if not aa:continue
                                  a=max(aa,key=lambda v:len(v['name']));mid=a['href'].rsplit('/',1)[-1]
                                  channels=[]
                                  for label,plat in platform_labels.items():
                                      m=re.search(re.escape(label)+r'\s*([\d,.]+\s*[KMB만천]?)',text,re.I)
                                      if m:channels.append({'platform':plat,'metric':numeric(m[1])})
                                  if not any(c['platform']==q['platform'] for c in channels):continue
                                  if mid not in rows:rows[mid]={'name':a['name'].strip(),'member_number':int(mid),'source_url':'https://inlink.to/p/'+mid,'directory_url':url,'category_slugs':[],'channels':channels,'adult_declared':bool(re.search(r'[2-9]0대',text)),'portfolio_count':card['portfolio_count'],'checked':'2026-09-22'}
                                  if q['category'] not in rows[mid]['category_slugs']:rows[mid]['category_slugs'].append(q['category'])
                              done+=1
                              if done%25==0:
                                  (root/'inlink_cards.json').write_text(json.dumps(list(rows.values()),ensure_ascii=False));print('SEARCH',done,'PROFILES',len(rows),flush=True)
                          except Exception as e:
                              errors.append({'url':url,'error':str(e)})
                              if 'http_stop_' in str(e):
                                  while not queue.empty():queue.get_nowait()
                          finally:queue.task_done()
                      await page.close()
                  await asyncio.gather(*(worker() for _ in range(3)))
                  await browser.close()
              (root/'inlink_cards.json').write_text(json.dumps(list(rows.values()),ensure_ascii=False));(root/'inlink_search_errors.json').write_text(json.dumps(errors,ensure_ascii=False));print('FINAL_CARDS',len(rows),'SEARCHES',done,'ERRORS',len(errors),flush=True)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-inlink-visible-cards
          path: research-output/inlink_cards.json
          retention-days: 1
          compression-level: 9
      - name: Read selected public profile links at a limited rate
        run: |
          python -u - <<'PY'
          import urllib.request,urllib.robotparser,urllib.parse,urllib.error,json,pathlib,re,time,threading,concurrent.futures,collections
          from bs4 import BeautifulSoup
          root=pathlib.Path('research-output');agent='PublicCreatorResearch/1.0 (public channel links; no outreach)'
          rp=urllib.robotparser.RobotFileParser()
          with urllib.request.urlopen('https://inlink.to/robots.txt',timeout=20) as r:rp.parse(r.read().decode().splitlines())
          rows=json.loads((root/'inlink_cards.json').read_text());weights={'supplies':30,'lifestyle':28,'beauty':24,'travel':14,'fashion':12,'fitness':10,'food':4}
          def score(x):
              return max([weights.get(c,0) for c in x['category_slugs']] or [0])+8*x['adult_declared']
          def eligible(x,p):
              ms=[c['metric'] for c in x['channels'] if c['platform']==p and c['metric'] is not None]
              if not ms:return False
              return 300<=max(ms)<=100000 if p=='instagram' else 10<=max(ms)<=20000
          ordered=sorted(rows,key=lambda x:(-score(x),x['member_number']))
          ig=[x for x in ordered if eligible(x,'instagram')][:1650];igs={x['member_number'] for x in ig}
          nb=[x for x in ordered if eligible(x,'naver_blog') and x['member_number'] not in igs][:1500]
          selected=ig+nb;print('SELECTED',len(ig),'IG',len(nb),'BLOG',flush=True)
          lock=threading.Lock();last=[0];stop=threading.Event()
          emailre=re.compile(r'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}')
          def one(x):
              z=dict(x);z['detail_ok']=False;url=x['source_url']
              try:
                  if stop.is_set():raise RuntimeError('host_stopped')
                  if not rp.can_fetch(agent,url) or not rp.can_fetch('ChatGPT-User',url):raise RuntimeError('robots_disallow')
                  with lock:time.sleep(max(0,.65-(time.monotonic()-last[0])));last[0]=time.monotonic()
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=25) as r:html=r.read(2500000).decode('utf-8','replace')
                  s=BeautifulSoup(html,'html.parser');links=[];posts=[]
                  for a in s.find_all('a',href=True):
                      u=a['href'];parts=urllib.parse.urlsplit(u);host=parts.netloc.lower();pp=[v for v in parts.path.split('/') if v]
                      platform=None
                      if host in ['instagram.com','www.instagram.com'] and len(pp)==1 and pp[0] not in ['p','reel','reels','stories','explore','accounts']:platform='instagram'
                      if host in ['blog.naver.com','m.blog.naver.com'] and len(pp)==1 and re.fullmatch(r'[A-Za-z0-9_-]{2,50}',pp[0]):platform='naver_blog'
                      if host in ['youtube.com','www.youtube.com','m.youtube.com'] and pp and (pp[0].startswith('@') or (len(pp)==2 and pp[0] in ['channel','c','user'])):platform='youtube'
                      if platform:links.append({'platform':platform,'url':u,'label':a.parent.get_text(' ',strip=True)[:180]})
                      if host in ['blog.naver.com','m.blog.naver.com'] and len(pp)>=2 and re.fullmatch(r'\d{9,}',pp[1]):posts.append({'title':a.get_text(' ',strip=True)[:160],'url':u})
                  text=s.get_text(' ',strip=True);start=text.find('의 포트폴리오 | 인링크 inlink');intro=text[start+len('의 포트폴리오 | 인링크 inlink'):] if start>=0 else text
                  end=intro.find('SNS 채널');intro=intro[:end] if end>=0 else intro[:500]
                  z['intro']=intro[:1200];z['social_urls']=list({a['url']:a for a in links}.values());z['portfolio_links']=posts[:8]
                  z['emails']=sorted(set(emailre.findall(intro))) if re.search('문의|비즈니스|협업|광고|contact|business|협찬|mail|메일',intro,re.I) else []
                  z['detail_ok']=bool(links)
              except urllib.error.HTTPError as e:
                  z['error']='HTTP_'+str(e.code)
                  if e.code in (403,429):stop.set()
              except Exception as e:z['error']=str(e)
              return z
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              for i,z in enumerate(ex.map(one,selected)):
                  out.append(z)
                  if i%100==0:
                      (root/'inlink_enriched.json').write_text(json.dumps(out,ensure_ascii=False));print('DETAILS',i,'OK',sum(x['detail_ok'] for x in out),flush=True)
          (root/'inlink_enriched.json').write_text(json.dumps(out,ensure_ascii=False));print('FINAL_DETAILS',len(out),'OK',sum(x['detail_ok'] for x in out),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-inlink-enriched-profiles
          path: research-output/
          retention-days: 1
          compression-level: 9

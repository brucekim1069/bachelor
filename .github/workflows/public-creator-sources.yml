name: Public creator source research
on:
  push:
    branches: [research/public-creator-sources-20260922]
    paths: [.github/workflows/public-creator-sources.yml]
permissions: {}
jobs:
  inspect-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public pages without authentication or outreach
        run: |
          mkdir -p research-output
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.robotparser, json, pathlib, time, re, concurrent.futures
          root = pathlib.Path('research-output')
          agent = 'PublicCreatorResearch/1.0 (public professional profiles; no outreach)'
          sites = {
              'inlink': 'https://inlink.to/discover',
              'ndex': 'https://www.ndex.kr/',
              'utoo': 'https://kr.utoo.be/rankings',
              'allsns': 'https://allsnsrank.com/youtube/category/vlog',
              'playboard': 'https://playboard.co/en/search?q=' + urllib.parse.quote('브이로그'),
              'creatorrank': 'https://creatorrank.co.kr/',
          }
          def read(url, limit=3000000):
              req = urllib.request.Request(url, headers={'User-Agent':agent, 'Accept':'text/html,application/json,text/plain,*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.read(limit).decode('utf-8', errors='replace'), r.geturl()
          def process(item):
              label, url = item
              result = {'label':label, 'url':url}
              try:
                  origin = urllib.parse.urlsplit(url)
                  ru = f'{origin.scheme}://{origin.netloc}/robots.txt'
                  try:
                      status, robots, _ = read(ru, 100000)
                      (root/f'{label}-robots.txt').write_text(robots)
                      rp = urllib.robotparser.RobotFileParser(); rp.parse(robots.splitlines())
                      result['robots_allowed'] = rp.can_fetch(agent,url)
                      if not result['robots_allowed']:
                          result['status']='robots_disallow'; return result
                  except urllib.error.HTTPError as e:
                      if e.code not in (404,410):
                          result['status']='robots_http_'+str(e.code); return result
                  status, html, final = read(url)
                  (root/f'{label}.html').write_text(html)
                  result.update(status=status, final_url=final, bytes=len(html))
                  scripts = re.findall(r'<script[^>]+src=[\"\x27]([^\"\x27]+)', html)
                  links = re.findall(r'href=[\"\x27]([^\"\x27]+)',html)
                  result['scripts']=[urllib.parse.urljoin(final,s) for s in scripts]
                  result['links']=list(dict.fromkeys(links))[:300]
                  for i,s in enumerate(result['scripts'][:8]):
                      host=urllib.parse.urlsplit(s).netloc
                      if host != urllib.parse.urlsplit(final).netloc: continue
                      try:
                          if 'rp' in locals() and not rp.can_fetch(agent,s):continue
                          time.sleep(0.5)
                          _, js, _ = read(s,2000000)
                          (root/f'{label}-script-{i}.js').write_text(js)
                      except Exception:pass
              except Exception as e:
                  result['error']=str(e)
              return result
          results=list(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(process,sites.items()))
          (root/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          for r in results: print(r['label'],r.get('status'),r.get('bytes'),r.get('error',''), 'scripts',len(r.get('scripts',[])))
          PY
      - name: Save short-lived public-source files
        uses: actions/upload-artifact@v4
        with:
          name: public-creator-source-inspection
          path: research-output/
          retention-days: 1
          compression-level: 9

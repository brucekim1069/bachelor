name: Public creator source research
on:
  push:
    branches: [research/public-creator-sources-20260922]
    paths: [.github/workflows/public-creator-sources.yml]
permissions: {}
jobs:
  inspect-channel-format:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read four public pages
        run: |
          mkdir -p research-output
          python - <<'PY'
          import urllib.request,urllib.robotparser,pathlib,time,json
          root=pathlib.Path('research-output');host='https://allsnsrank.com';agent='PublicCreatorResearch/1.0 (public profile format check; no outreach)'
          req=urllib.request.Request(host+'/robots.txt',headers={'User-Agent':agent})
          with urllib.request.urlopen(req,timeout=20) as r:robots=r.read().decode()
          rp=urllib.robotparser.RobotFileParser();rp.parse(robots.splitlines())
          urls=['/youtube/channel/UChIFK3pewudHwqvZ2LNEa4g','/youtube/channel/UCGvmZahsB65iDzbsP_r_cZA','/youtube/channel/UC7giRJDyHuxffj4dfSHy_TQ','/youtube/find?cat=4&p=2&smax=100000&smin=500']
          manifest=[]
          for i,path in enumerate(urls):
              url=host+path
              if not rp.can_fetch(agent,url) or not rp.can_fetch('ChatGPT-User',url):continue
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':agent})
                  with urllib.request.urlopen(req,timeout=30) as r:text=r.read(1500000).decode('utf-8','replace')
                  (root/('channel-'+str(i)+'.html')).write_text(text);manifest.append({'url':url,'file':'channel-'+str(i)+'.html'})
              except Exception as e:manifest.append({'url':url,'error':str(e)})
              time.sleep(1)
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2));print(manifest)
          PY
      - name: Save public page samples
        uses: actions/upload-artifact@v4
        with:
          name: public-channel-page-samples
          path: research-output/
          retention-days: 1
          compression-level: 9
